services:
  app:
    build: .
    image: maahandloom-app
    container_name: maahandloom_app
    restart: always
    ports:
      - "8080:3000" # Expose on port 8080 to avoid conflict with Nginx/Apache
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=postgres
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/ecommerce
      # Add PhonePe keys here or in .env file
      # PhonePe V2 Credentials
      - PHONEPE_CLIENT_ID=${PHONEPE_CLIENT_ID}
      - PHONEPE_CLIENT_SECRET=${PHONEPE_CLIENT_SECRET}
      - PHONEPE_CLIENT_VERSION=${PHONEPE_CLIENT_VERSION}
      - PHONEPE_ENV=${PHONEPE_ENV}
      - PHONEPE_WEBHOOK_USERNAME=${PHONEPE_WEBHOOK_USERNAME}
      - PHONEPE_WEBHOOK_PASSWORD=${PHONEPE_WEBHOOK_PASSWORD}
      - APP_BE_URL=https://indritafabrics.com
      # Cloudflare R2 Credentials
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-d098e896b8f7dc0403ad3a16f592dfe6}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-chf-media}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-989af8ef35b94b6abf46b295af3c50d3}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-a8000cd7a60e056098ec04e0580328bbf21fff4f0da6126075cc3ed05f79ab95}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-https://pub-ce8688bc6c654bcfb99716f7c9373bcd.r2.dev}
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: maahandloom_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=ecommerce
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
